name: One-time security dependency repair
on:
  push:
    branches: [security/dependency-audit-20261105]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair lockfile and commit compatible fixes
        shell: bash
        run: |
          npm audit fix --package-lock-only || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- package-lock.json; then
            git add package-lock.json
            git commit -m 'security(deps): apply compatible patched npm dependencies'
            git push origin HEAD:security/dependency-audit-20261105
          fi
